<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TrustMindLab - DevSecOps HomeLab Documentation</title>
    <meta name="description" content="A personal DevSecOps sandbox and homelab documentation project.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
    <style>
        :root {
            --theme-color: #58a6ff;
            --base-background-color: #0d1117;
            --cover-background-color: #0d1117;
            --sidebar-background: #161b22;
            --sidebar-nav-link-color: #c9d1d9;
            --sidebar-nav-link-color--active: #58a6ff;
            --link-color: #58a6ff;
            --code-theme-background: #161b22;
            --notice-tip-border-color: #3fb950;
            --notice-important-border-color: #f0883e;
        }

        .cover {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%) !important;
        }

        .cover h1 {
            color: #58a6ff !important;
        }

        /* Mobile responsive fixes */
        @media screen and (max-width: 768px) {
            .markdown-section {
                padding: 15px;
                max-width: 100%;
            }
            
            .markdown-section table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            
            .markdown-section pre {
                overflow-x: auto;
                padding: 10px;
            }
            
            .markdown-section code {
                word-break: break-word;
            }
            
            .markdown-section img {
                max-width: 100%;
                height: auto;
            }
            
            .sidebar {
                padding-top: 20px;
            }
            
            body {
                font-size: 14px;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'TrustMindLab',
            repo: 'goAuD/TrustMindLab',
            loadSidebar: true,
            subMaxLevel: 2,
            coverpage: true,
            auto2top: true,
            relativePath: true,
            search: {
                placeholder: 'Search...',
                noData: 'No results',
                depth: 3
            },
            themeable: {
                readyTransition: true,
                responsiveTables: true
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ini.min.js"></script>
</body>

</html>
